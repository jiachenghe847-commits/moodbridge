services:
  app:
    build:
      context: .
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
    expose:
      - "3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  db-init:
    build:
      context: .
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/prod.db
    command: ["npm", "run", "db:push"]
    volumes:
      - ./data:/app/data
    profiles:
      - tools

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
